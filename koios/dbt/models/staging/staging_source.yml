      - name: ctms_stg__subject_summary_report
        description: Combined subject-level data from multiple sources.
        columns:
          - name: status
            tests:
              - accepted_values:
                  values: ['Off study', 'On Treatment', 'Screening', 'Screen Failure', 'On Study', 'Completed', 'Discontinued', 'Enrolled', 'In-Active', 'Randomized', 'Screen Failure Rollback Requested']