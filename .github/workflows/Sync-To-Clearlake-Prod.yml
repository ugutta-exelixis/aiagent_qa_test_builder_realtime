# This workflow Sync the application code to the clearlake dev MWAA s3
# It can also be manually run on a selected branch.

name: 'Sync to ClearlakeProd'

on: 
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  id-token: write
  
jobs:
  development:
    name: 'Sync to ClearlakeProd'
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5
      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
        with:
          role-to-assume: arn:aws:iam::754095075756:role/prod-daplex-drugdevelopment-3dl-github-action-role
          aws-region: us-west-2
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@e8b481e524a99f37fbd39fdc1dcb3341ab091367
      - name: dt koios dbt to S3
        run: aws s3 sync ./koios/dbt/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/dbt/drugdevelopment/koios/ --delete
      - name: dt koios dbt to S3 clearlake
        run: aws s3 sync ./koios/dbt/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/dags/dbt/drugdevelopment/koios/ --delete
      - name: dt koios dags to S3
        run: aws s3 sync ./koios/dags/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/dags/drugdevelopment/koios/ --delete
      # koios raw ingestion
      - name: dt koios raw ingest Scripts to S3
        run: aws s3 sync ./ingest_koios_raw/scripts/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/scripts/drugdevelopment/ingest_koios_raw/ --delete
      - name: dt koios raw ingest dags to S3
        run: aws s3 sync ./ingest_koios_raw/dags/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/dags/drugdevelopment/ingest_koios_raw/ --delete
      - name: dt koios raw ingest Scripts to S3 mwaa
        run: aws s3 sync ./ingest_koios_raw/scripts/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/dags/scripts/drugdevelopment/ingest_koios_raw/ --delete
      # koios manual ingestion
      - name: dt ingest_koios_manual Scripts to S3
        run: aws s3 sync ./ingest_koios_manual/scripts/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/scripts/drugdevelopment/ingest_koios_manual/ --delete
      - name: dt ingest_koios_manual dags to S3
        run: aws s3 sync ./ingest_koios_manual/dags/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/dags/drugdevelopment/ingest_koios_manual/ --delete
      - name: dt ingest_koios_manual Scripts to S3 mwaa
        run: aws s3 sync ./ingest_koios_manual/scripts/ s3://exelixis-clearlake-drugdev-airflow-prod-us-west-2-754095075756/dags/scripts/drugdevelopment/ingest_koios_manual/ --delete
