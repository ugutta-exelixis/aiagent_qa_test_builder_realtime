    LEFT JOIN {bronze:account_association} sa
        ON s.study_site_id = sa.study_site_source_id
    LEFT JOIN {bronze:study_country} sc
        ON s.study_country_id = sc.study_country_source_id
    LEFT JOIN {common:country_region_mapping} crm
        ON case when upper(sc.study_region) = 'UNITED STATES OF AMERICA' then 'UNITED STATES'
              when upper(sc.study_region) = 'KOREA, REPUBLIC OF' then 'SOUTH KOREA'
              when upper(sc.study_region) = 'TAIWAN, REPUBLIC OF CHINA' then 'TAIWAN'
              else upper(sc.study_region) end = crm.country)
    select /*+ BROADCAST(spm) */ sa.* except(sa.site_type,sa.parent_site),
      case when spm.parent_site_number is not null  then 'Satellite' else sa.site_type end as site_type,
      case when spm.parent_site_number is not null  then spm.parent_site_number else sa.parent_site end as parent_site
      from site_actual sa
      left join {common:site_parent_mapping} spm
      on sa.site_number = spm.site_number
