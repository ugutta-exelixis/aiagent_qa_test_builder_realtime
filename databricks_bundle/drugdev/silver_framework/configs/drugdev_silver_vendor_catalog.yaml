  cross_entity_sql: "with pi_info as(\n  select \n    study_id,\n    site_number,\n    external_id,\n    full_name as pi_name,\
    \ \n    phone as pi_phone,\n    email as pi_email \n    FROM {staging_table}\n    where study_team_role in('Primary Investigator','Principal\
    \ Investigator')),\nsc_info as(\n    select \n    study_id,\n    site_number,\n    external_id, \n    sc_name, \n    sc_email,\
    \ \n    sc_phone from (\n    select study_id,\n        site_number,\n        start_date,\n        full_name as sc_name,\n\
    \        email as sc_email, \n        phone as sc_phone,\n        external_id as external_id,\n    row_number()OVER(partition\
    \ by study_id||site_number\n    order by (case when full_name is not null and  phone is not null and  email is not null\
    \ then  1 else 2 end),\n        site_number,external_id desc, cast(start_date as date) DESC) as CA_RANK\n    FROM {staging_table}\
    \   \n    where study_team_role in ('Study Coordinator','Study Coordinator - Unblinded')\n    group by study_id, site_number,\
    \ start_date, full_name, email , phone , external_id \n  ) as a where ca_rank= 1\n)\nselect distinct si.study_id,si.study_site_id_sk,\
    \ si.site_number, si.site_status, si.site_name, si.department, si.address, si.address_2, si.address_3, si.city, si.state,\
    \ si.site_country, si.postal_zip_code,\n  pi.pi_name, pi.pi_phone, pi.pi_email, sc.sc_name, sc.sc_phone, sc.sc_email\n\
    \  from \n  {staging_table} si\n    left join pi_info pi\n    on si.site_number= pi.site_number\n    and si.study_id =\
    \ pi.study_id\n    left join sc_info sc\n    on si.site_number= sc.site_number\n    and si.study_id = sc.study_id\n"
