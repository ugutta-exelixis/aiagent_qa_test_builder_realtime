domain_name: DrugDev
data_product_name: DrugDev
owner_team: clinical_data_engineering
vendor_entities:
- vendor: 4G
  entity: cohort_summary_report
  scd_business_keys:
  - cohort
  - cohort_group
  - study_id
  canonical_cols:
  - study_id
  - cohort_group
  - cohort
  - cohort_description
  - cohort_status
  - rank
  - screening_cap
  - enrollment_cap
  - total_screened
  - total_enrolled
  - dosing_scheme
  - dose_level
  - list_of_approved_countries
  - hash_key
  column_types:
    study_id: string
    cohort_group: string
    cohort: string
    cohort_description: string
    cohort_status: string
    rank: string
    screening_cap: string
    enrollment_cap: string
    total_screened: string
    total_enrolled: string
    dosing_scheme: string
    dose_level: string
    list_of_approved_countries: string
    hash_key: string
  zorder_cols:
  - study_id
  table_sensitivity: INTERNAL
  pii_columns: []
  transformation_logic: "cast(study_id as string) as study_id,\ncase when cohort = 'A11' and cohort_description = 'Cohort\
    \ A5b: 2.8 mg/kg' then 'A5b'\t\n    else cohort\n    end as cohort,\ntry_cast(screening_cap    as int) as screening_cap,\n\
    try_cast(total_screened   as int) as total_screened,\ntry_cast(total_enrolled   as int) as total_enrolled,\ncast(dose_level\
    \ as string) as dose_level,\nmd5(study_id||cohort_group||cohort) as hash_key\n"
  cross_entity_sql: null
  validation_rules:
    rules:
    - rule_id: IRT-4G-CS-NNL-001
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: study_id
      description: study_id must never be null
    - rule_id: IRT-4G-CS-RGX-001
      check: regex_match
      severity: HIGH
      mode: quarantine
      field: study_id
      expression: ^[A-Z]{2}[0-9]{3}-[0-9]{3}$
      description: study_id must match the pattern XX999-999
    - rule_id: IRT-4G-CS-NNL-002
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: cohort
      description: cohort must never be null
    - rule_id: IRT-4G-CS-UNQ-002
      check: compound_unique
      severity: CRITICAL
      mode: quarantine
      field:
      - cohort
      - cohort_group
      - study_id
      description: cohort must be unique per cohort_group and study_id
    - rule_id: IRT-4G-CS-NNL-003
      check: not_null
      severity: HIGH
      mode: quarantine
      field: cohort_status
      description: cohort_status must never be null
    - rule_id: IRT-4G-CS-NNL-004
      check: not_null
      severity: HIGH
      mode: quarantine
      field: cohort_group
      description: cohort_group shouldn't be null
    - rule_id: IRT-4G-CS-XFLD-001
      check: cross_field
      severity: HIGH
      mode: flag
      field: ''
      expression: total_enrolled IS NULL OR total_screened IS NULL OR total_enrolled <= total_screened
      description: total_enrolled cannot exceed total_screened
- vendor: 4G
  entity: subject_summary_report
  scd_business_keys:
  - subject
  - study_id
  canonical_cols:
  - study_id
  - studysite
  - investigator
  - country
  - subject
  - participant_number
  - cohort_desc
  - cohort
  - study_phase
  - tumor_type
  - treatment_arm
  - dose_level_treatment_arm
  - dose_level_treatment_arm_1
  - documented_ras_status
  - liver_metastasis
  - region
  - status
  - last_visit
  - last_visit_date
  - next_expected_visit
  - next_expected_visit_date
  - hash_key
  column_types:
    study_id: string
    studysite: string
    investigator: string
    country: string
    subject: string
    participant_number: string
    cohort_desc: string
    cohort: string
    study_phase: string
    tumor_type: string
    treatment_arm: string
    dose_level_treatment_arm: string
    dose_level_treatment_arm_1: string
    documented_ras_status: string
    liver_metastasis: string
    region: string
    status: string
    last_visit: string
    last_visit_date: date
    next_expected_visit: string
    next_expected_visit_date: date
    hash_key: string
  zorder_cols:
  - study_id
  - subject
  table_sensitivity: CONFIDENTIAL
  pii_columns:
  - column: subject
    pii_category: SUBJECT_IDENTIFIER
    sensitivity: RESTRICTED
  - column: participant_number
    pii_category: SUBJECT_IDENTIFIER
    sensitivity: RESTRICTED
  transformation_logic: |
    cast(study_id as string) as study_id,
    cast(subject as string) as subject,
    case when country = 'KOREA (THE REPUBLIC OF)' then 'SOUTH KOREA'
        when country = 'CZECHIA' then 'CZECH REPUBLIC'
        when country = 'UNITED STATES OF AMERICA' then 'UNITED STATES'
        else cast(upper(country) as string) end as  country,
    coalesce(to_date(last_visit_date,              'yyyy-MM-dd'), to_date(initcap(last_visit_date), 'dd-MMM-yyyy')) as last_visit_date,
    coalesce(to_date(next_expected_visit_date,     'yyyy-MM-dd'), to_date(initcap(next_expected_visit_date), 'dd-MMM-yyyy')) as next_expected_visit_date,
    right(cast(subject as string), 4) as participant_number,
    md5(study_id||studysite||investigator||country||subject) as hash_key
  cross_entity_sql: null
  validation_rules:
    rules:
    - rule_id: IRT-4G-SS-NNL-001
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: subject
      description: subject must never be null
    - rule_id: IRT-4G-SS-UNQ-002
      check: compound_unique
      severity: CRITICAL
      mode: quarantine
      field:
      - subject
      - study_id
      description: subject must be unique per study_id
    - rule_id: IRT-4G-SS-RGX-001
      check: regex_match
      severity: HIGH
      mode: quarantine
      field: study_id
      expression: ^[A-Z]{2}[0-9]{3}-[0-9]{3}$
      description: study_id must match the pattern XX999-999
    - rule_id: IRT-4G-SS-NNL-003
      check: not_null
      severity: HIGH
      mode: quarantine
      field: status
      description: status must never be null
    - rule_id: IRT-4G-SS-NNL-004
      check: not_null
      severity: HIGH
      mode: quarantine
      field: studysite
      description: studysite must never be null
    - rule_id: IRT-4G-SS-NEQ-004
      check: cross_field
      severity: HIGH
      mode: quarantine
      field: studysite
      expression: studysite IS NULL OR studysite != '9999'
      description: studysite must not equal '9999'
    - rule_id: IRT-4G-SS-XFLD-001
      check: cross_field
      severity: HIGH
      mode: flag
      field: ''
      expression: last_visit_date IS NULL OR next_expected_visit_date IS NULL OR next_expected_visit_date >= last_visit_date
      description: next_expected_visit_date must be on or after last_visit_date when both present
- vendor: 4G
  entity: subject_visit_summary_report
  scd_business_keys:
  - subject
  - visit_id
  - visit_description
  - study_id
  - drug_unit_id
  canonical_cols:
  - study_id
