- vendor: Planisware
  entity: milestones
  scd_business_keys:
  - protocol_number
  - activity_type_actual
  - study_phase_norm
  - project
  - line_identifier
  canonical_cols:
  - project
  - project_type
  - is_public_version
  - line_identifier
  - name
  - activity_type
  - activity_type_actual
  - protocol_number
  - study_phase_norm
  - cohort
  - planned_finish
  - approved_baseline
  - actual_finish
  - original_baseline
  - last_modified_date
  - load_date
  - is_required
  - protocol_number_sk
  - protocol_no_study_phase_sk
  - protocol_activity_type_actual_sk
  - status
  column_types:
    project: string
    project_type: string
    is_public_version: string
    line_identifier: string
    name: string
    activity_type: string
    activity_type_actual: string
    protocol_number: string
    study_phase_norm: string
    cohort: string
    planned_finish: string
    approved_baseline: string
    actual_finish: string
    original_baseline: string
    last_modified_date: date
    load_date: date
    is_required: string
    protocol_number_sk: string
    protocol_no_study_phase_sk: string
    protocol_activity_type_actual_sk: string
    status: string
  zorder_cols:
  - protocol_number
  - activity_type_actual
  - study_phase_norm
  table_sensitivity: INTERNAL
  pii_columns: []
  transformation_logic: "case when split(activity_type, '-')[0] = 'LPLV'  then 'CCO' \n    else split(activity_type, '-')[0]\
    \ \nend as activity_type_actual,\nmd5(concat_ws('|', split(activity_type, '-')[0], protocol_number ) ) as protocol_activity_type_actual_sk,\n\
    case when lower(protocol_number) rlike '(exp|esc)$' then regexp_extract(protocol_number, '^(.*?)(exp|esc)$', 1)\n    else\
    \ protocol_number\nend as protocol_number,\ncase when lower(protocol_number) like '%exp' then 'Expansion'\n    when lower(protocol_number)\
    \ like '%esc' then 'Escalation' else 'empty'\nend as study_phase_norm,\ncast(cohort as string) as cohort,\ndate_format(\
    \  coalesce( to_date(planned_finish, 'yyyy-MM-dd'),\n    to_date(planned_finish, 'MM/dd/yyyy'),\n    to_date(planned_finish,\
    \ 'MM/dd/yy')\n  ),  'yyyy/MM/dd') as planned_finish,\ncast(approved_baseline as string) as approved_baseline,\ndate_format(\
    \ coalesce( to_date(actual_finish, 'yyyy-MM-dd'),\n    to_date(actual_finish, 'MM/dd/yyyy'),\n    to_date(actual_finish,\
    \ 'MM/dd/yy')\n  ),  'yyyy/MM/dd') as actual_finish,\ncast(original_baseline as string) as original_baseline,\ncast(send_to_onepager_5_koios\
    \ as string) as is_required,\ncast(`_ingestion_timestamp` as date) as load_date,\n`_arrival_time` as last_modified_date\n"
  cross_entity_sql: "WITH planisware_meta AS (\nSELECT MAX(last_modified_date) AS last_modified_date,\n    MAX(load_date)\
    \ AS load_date\nFROM {staging_table}),\nactual_counts AS (\n    SELECT protocol_number,\n        study_phase_norm,\n \
    \       activity_type_actual,\n        COUNT(*) AS actual_count\n    FROM {staging_table}\n    WHERE protocol_number rlike\
    \ '^X[A-Z][0-9]{3}-[0-9]{3}$'\n      AND protocol_number NOT IN (SELECT DISTINCT protocol_number FROM {common:planisware_exs_ref}\n\
    \          WHERE state = 'blocked')\n    GROUP BY protocol_number, study_phase_norm, activity_type_actual\n),\nreference_activities\
    \ AS (\n  SELECT protocol_number,\n      study_phase,\n      milestones,\n      expected_count\n  FROM {common:planisware_exs_ref}\n\
    \    WHERE protocol_number NOT IN (SELECT DISTINCT protocol_number FROM {common:planisware_exs_ref}\n    WHERE state =\
    \ 'blocked')\n),\nactivity_statuses AS (\n  SELECT COALESCE(ac.protocol_number, ra.protocol_number) AS protocol_number,\n\
    \    COALESCE(ac.study_phase_norm, ra.study_phase) AS study_phase_norm,\n    COALESCE(ac.activity_type_actual, ra.milestones)\
    \ AS activity_type_actual,\n    ac.actual_count,\n    ra.expected_count,\n    CASE WHEN ac.protocol_number IS NULL THEN\
    \ 'missing'\n        WHEN ra.protocol_number IS NULL THEN 'new'\n        WHEN ac.actual_count > ra.expected_count THEN\
    \ 'duplicate'\n        WHEN ac.actual_count = ra.expected_count THEN 'ok'\n    END AS status\n  FROM actual_counts ac\n\
    \    FULL OUTER JOIN reference_activities ra\n    ON ac.protocol_number = ra.protocol_number\n    AND ac.study_phase_norm\
    \ = ra.study_phase\n    AND ac.activity_type_actual = ra.milestones\n  WHERE ac.protocol_number IS NULL OR ra.protocol_number\
    \ IS NULL OR ac.actual_count >= ra.expected_count\n)      \n(SELECT\n    pd.project,\n    pd.project_type,\n    pd.is_public_version,\n\
    \    pd.line_identifier,\n    pd.name,\n    pd.activity_type,\n    pd.activity_type_actual,\n    pd.protocol_number,\n\
    \    pd.study_phase_norm,\n    pd.cohort,\n    pd.planned_finish,\n    pd.approved_baseline,\n    pd.actual_finish,\n\
    \    pd.original_baseline,\n    pd.last_modified_date,\n    pd.load_date,\n    pd.is_required,\n    md5(pd.protocol_number)\
    \ as protocol_number_sk,\n    md5(concat_ws('|',pd.protocol_number,pd.study_phase_norm)) as protocol_no_study_phase_sk,\n\
    \    pd.protocol_activity_type_actual_sk,\n    rp.status\nFROM {staging_table} pd\nJOIN activity_statuses rp\n    ON pd.protocol_number\
    \ = rp.protocol_number\n  AND pd.study_phase_norm = rp.study_phase_norm\n  AND pd.activity_type_actual = rp.activity_type_actual\n\
    \  WHERE rp.status IN ('new', 'duplicate', 'missing', 'ok')\n  order by pd.protocol_number)\nUNION ALL\nSELECT\n  NULL\
    \ AS project,\n  NULL AS project_type,\n  NULL AS is_public_version,\n  NULL AS line_identifier,\n  NULL AS name,\n  NULL\
    \ AS activity_type,\n  activity_type_actual,\n  protocol_number,\n  study_phase_norm,\n  NULL AS cohort,\n  NULL AS planned_finish,\n\
    \  NULL AS approved_baseline,\n  NULL AS actual_finish,\n  NULL AS original_baseline,\n  pm.last_modified_date,\n  pm.load_date,\n\
    \  NULL AS is_required,\n  NULL AS protocol_number_sk,\n  NULL AS protocol_no_study_phase_sk,\n  NULL AS protocol_activity_type_actual_sk,\n\
    \  status\nFROM activity_statuses\nCROSS JOIN planisware_meta pm\nwhere status = 'missing'\nUNION ALL\nSELECT\n    NULL\
    \ AS project,\n    NULL AS project_type,\n    NULL AS is_public_version,\n    NULL AS line_identifier,\n    NULL AS name,\n\
    \    NULL AS activity_type,\n    milestones AS activity_type_actual,\n    protocol_number,\n    study_phase AS study_phase_norm,\n\
    \    NULL AS cohort,\n    planned_date AS planned_finish,\n    NULL AS approved_baseline,\n    actual_date AS actual_finish,\n\
    \    NULL AS original_baseline,\n    pm.last_modified_date,\n    pm.load_date,\n    NULL AS is_required,\n    md5(protocol_number)\
    \ AS protocol_number_sk,\n    NULL AS protocol_no_study_phase_sk,\n    NULL AS protocol_activity_type_actual_sk,\n   \
    \ 'ok' AS status\nFROM {common:planisware_exs_ref}\nCROSS JOIN planisware_meta pm\nWHERE state = 'blocked'\n"
  validation_rules:
    rules:
    - rule_id: IPP-PLW-PM-NNL-001
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: protocol_number
      description: protocol_number must never be null
    - rule_id: IPP-PLW-PM-NNL-002
      check: not_null
      severity: HIGH
      mode: quarantine
      field: activity_type_actual
      description: activity_type_actual must never be null
    - rule_id: IPP-PLW-PM-XFLD-001
      check: cross_field
      severity: MEDIUM
      mode: flag
      field: ''
      expression: actual_finish IS NULL OR actual_finish >= approved_baseline
      description: actual_finish should be on or after approved_baseline
