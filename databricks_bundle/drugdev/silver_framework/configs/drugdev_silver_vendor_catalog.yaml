- vendor: IQVIA
  entity: study_country
  scd_business_keys:
  - study_id
  - study_country_id
  canonical_cols:
  - study_id
  - study_country_id
  - country_name
  - country_status
  - hash_key
  column_types:
    study_id: string
    study_country_id: string
    country_name: string
    country_status: string
    hash_key: string
  zorder_cols:
  - study_id
  - study_country_id
  table_sensitivity: INTERNAL
  pii_columns: []
  transformation_logic: |
    cast(clinical_study_source_id as String) as study_id,
    cast(study_country_source_id as String) as study_country_id,
    case
      when UPPER(study_region) = 'KOREA, REPUBLIC OF'        then 'SOUTH KOREA'
      when UPPER(study_region) = 'UNITED STATES OF AMERICA'  then 'UNITED STATES'
      when UPPER(study_region) = 'TAIWAN, REPUBLIC OF CHINA' then 'TAIWAN'
      else UPPER(study_region)
      end as country_name,
    cast(study_region_status as String) as country_status,
    MD5(clinical_study_source_id || study_country_source_id) as hash_key
  cross_entity_sql: |
    select /*+ BROADCAST(crm) */ distinct sc.* EXCEPT (country_status, study_country_id),
      crm.study_country_id,
      case when  count(case when s.site_status IN ('Enrollment Open', 'Enrollment On-Hold')
                       OR s.site_status = 'Enrollment Closed' then 1 end) over (PARTITION BY sc.study_country_id) > 0 then 'Active'
            when count(case when s.site_status = 'Selected' then 1 end) over (PARTITION BY sc.study_country_id) > 0 THEN 'Approved'
            when count(case when s.site_status = 'Dropped' then 1 end) over (PARTITION BY sc.study_country_id) > 0 THEN 'Terminated'
            else coalesce(s.site_status, sc.country_status) end as country_status
    FROM {staging_table} sc
    LEFT JOIN {bronze:study_site} s
      ON  sc.study_country_id = s.study_country_source_id
      AND sc.study_id         = s._study_id
    LEFT JOIN {common:country_region_mapping} crm
      ON CASE WHEN UPPER(sc.country_name) = 'UNITED STATES OF AMERICA' THEN 'UNITED STATES'
              WHEN UPPER(sc.country_name) = 'KOREA, REPUBLIC OF' THEN 'SOUTH KOREA'
              WHEN UPPER(sc.country_name) = 'TAIWAN, REPUBLIC OF CHINA' THEN 'TAIWAN'
              ELSE UPPER(sc.country_name) END = crm.country
  validation_rules:
    rules:
    - rule_id: CTMS-IQVIA-SC-NNL-001
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: study_id
      description: study_id must never be null
    - rule_id: CTMS-IQVIA-SC-RGX-001
      check: regex_match
      severity: HIGH
      mode: quarantine
      field: study_id
      expression: ^[A-Z]{2}[0-9]{3}-[0-9]{3}$
      description: study_id must match the pattern XX999-999
    - rule_id: CTMS-IQVIA-SC-NNL-002
      check: not_null
      severity: HIGH
      mode: quarantine
      field: study_country_id
      description: study_country_id must never be null
    - rule_id: CTMS-IQVIA-SC-UNQ-001
      check: compound_unique
      severity: HIGH
      mode: quarantine
      field:
      - study_country_id
      - study_id
      - country_name
      description: study_country_id must be unique per study_id and country_name
    - rule_id: CTMS-IQVIA-SC-NNL-003
      check: not_null
      severity: HIGH
      mode: quarantine
      field: country_status
      description: country_status must never be null
