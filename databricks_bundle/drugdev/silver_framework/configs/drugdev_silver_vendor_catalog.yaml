  - column: actual_date
    pii_category: PII
    sensitivity: CONFIDENTIAL
  transformation_logic: |
    {
      "standard": "cast(study_id as string) as study_id,\ncast(subject as string) as subject,\ncase when country = 'KOREA (THE REPUBLIC OF)' then 'SOUTH KOREA' when country = 'CZECHIA' then 'CZECH REPUBLIC' when country = 'UNITED STATES OF AMERICA' then 'UNITED STATES' else cast(upper(country) as string) end as  country,\ncast(case when studysite ='119' then '108' else studysite end as string) as  studysite,\ncast(investigator as string) as  investigator,\ncase when visit_description in ('Enrollment', 'Enrollment V1', 'Expansion Randomization', 'W1D1','Cycle 1 Day 1','Cycle 1 Day 1 (Randomization)') then 'Randomization' when visit_description like '%Cycle%' and visit_description <> 'Cycle 1 Day 1' then 'Drug Request' when visit_description = 'Subject Status Change' then 'Rescreening' else visit_description end as visit_description,\ncoalesce( to_date(scheduled_date, 'yyyy-MM-dd'),  to_date(initcap(scheduled_date), 'dd-MMM-yyyy'),  to_date(initcap(scheduled_date), 'dd MMM yyyy'))as scheduled_date,\ncoalesce(to_date(actual_date, 'yyyy-MM-dd'),  to_date(initcap(actual_date), 'dd-MMM-yyyy'),  to_date(initcap(actual_date), 'dd MMM yyyy')) as actual_date,\nright(cast(subject as string), 4) as participant_number,\nmd5(study_id||country||studysite||subject||visit_description||actual_date) as hash_key\n",
      "post_processing": "filters:\n  - condition: \"actual_date is not null\"\ndeduplication:\n  keys: [subject, visit_id, visit_description, study_id, drug_unit_id]\n  order_by: \n    - actual_date\n"
    }
  cross_entity_sql: null
  validation_rules:
    rules:
    - rule_id: IRT-4G-SVS-NNL-001
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: study_id
      description: study_id must never be null
    - rule_id: IRT-4G-SVS-RGX-001
      check: regex_match
      severity: HIGH
      mode: quarantine
      field: study_id
      expression: ^[A-Z]{2}[0-9]{3}-[0-9]{3}$
      description: study_id must match the pattern XX999-999
    - rule_id: IRT-4G-SVS-NNL-002
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: subject
      description: subject must never be null
    - rule_id: IRT-4G-SVS-UNQ-002
      check: compound_unique
      severity: CRITICAL
      mode: quarantine
      field:
      - subject
      - visit_description
      - visit_id
      - study_id
      - drug_unit_id
      description: subject must be unique per visit_description, study_id, and drug_unit_id
    - rule_id: IRT-4G-SVS-NNL-003
      check: not_null
      severity: HIGH
      mode: quarantine
      field: studysite
      description: studysite must never be null
    - rule_id: IRT-4G-SVS-NEQ-003
      check: cross_field
      severity: HIGH
      mode: quarantine
      field: studysite
      expression: studysite IS NULL OR studysite != '9999'
      description: studysite must not equal '9999'
    - rule_id: IRT-4G-SVS-NNL-004
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: visit_description
      description: visit_description must never be null
    - rule_id: IRT-4G-SVS-NNL-005
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: actual_date
      description: actual_date shouldn't be null
    - rule_id: IRT-4G-SVS-XFLD-001
      check: cross_field
      severity: MEDIUM
      mode: flag
      field: ''
      expression: actual_date IS NULL OR scheduled_date IS NULL OR actual_date >= scheduled_date
      description: actual_date should be on or after scheduled_date when both present
