      severity: HIGH
      mode: quarantine
      field: study_id
      expression: ^[A-Z]{2}[0-9]{3}-[0-9]{3}$
      description: study_id must match the pattern XX999-999
    - rule_id: CTMS-IQVIA-SS-NNL-002
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: study_country_id
      description: study_country_id must never be null
    - rule_id: CTMS-IQVIA-SS-NNL-003
      check: not_null
      severity: CRITICAL
      mode: quarantine
      field: study_site_id
      description: study_site_id must never be null
    - rule_id: CTMS-IQVIA-SS-UNQ-001
      check: compound_unique
      severity: HIGH
      mode: quarantine
      field:
      - study_id
      - study_site_id
      - parent_site
      description: study_site_id must be unique per study_id and parent_site
    - rule_id: CTMS-IQVIA-SS-NNL-004
