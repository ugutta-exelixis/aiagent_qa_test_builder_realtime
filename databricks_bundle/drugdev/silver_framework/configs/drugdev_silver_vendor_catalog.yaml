  - protocol_version
  - hash_key
  column_types:
    study_id: string
    study_country_id: string
    study_site_id: string
    account_id: string
    pi_contact_id: string
    pi_address_id: string
    site_number: string
    icn_region: string
    site_type: string
    study_site_status: string
    parent_site: string
    site_status_reason: string
    protocol_version: string
    hash_key: string
  zorder_cols:
  - study_id
  - study_site_id
  - site_number
  table_sensitivity: INTERNAL
  pii_columns: []
  transformation_logic: "cast(clinical_study_source_id as STRING) as study_id,\ncast(study_country_source_id as string) as\
    \ study_country_id,\ncast(study_site_source_id as STRING) as study_site_id,\ncast(site_number as STRING) as site_number,\n\
    'Main' as site_type, \ncast(site_number as STRING) as parent_site,\nMD5(concat(clinical_study_source_id, study_site_source_id,\
    \ COALESCE(cast(site_number as STRING),''))) as hash_key\n"
  cross_entity_sql: |
    with site_actual as (
      select /*+ BROADCAST(crm) */ distinct s.* EXCEPT (s.study_country_id, s.account_id, s.icn_region, s.hash_key),
      cast(crm.study_country_id AS string) as study_country_id,
      cast(sa.account_source_id AS string) as account_id,
      case when crm.region = 'NA' then'North America'
          when crm.region = 'APAC' then 'Asia/Pacific'
          when crm.region = 'LATAM'THEN 'Latin America'
          when crm.region = 'EMEA'THEN 'Europe/Africa'
          else crm.region END AS icn_region,
    md5(concat(coalesce(s.study_id, ''),COALESCE(crm.study_country_id, ''),coalesce(s.study_site_id, ''),'',coalesce(s.pi_contact_id, ''))) as hash_key
