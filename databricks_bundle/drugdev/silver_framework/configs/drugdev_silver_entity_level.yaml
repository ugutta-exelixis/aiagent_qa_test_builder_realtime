domain_name: DrugDev
data_product_name: DrugDev
owner_team: clinical_data_engineering
datasets:
- dataset_name: 4g_xb002_101_cohort_summary_report
  source_dataset_name: 4g_xb002_101_cohort_summary_report
  mapping_rules: {}
  overrides:
    transformation_logic: |
      try_cast(enrollment_cap   as int) as enrollment_cap,
      case when cohort_group = 'Single-Agent' then 'SOLID TUMORS'
          else cohort_group end as cohort_group
    cross_entity_sql: null
- dataset_name: 4g_xb002_101_subject_summary_report
  source_dataset_name: 4g_xb002_101_subject_summary_report
  mapping_rules:
    studysite: study_site
    cohort_desc: cohort
    last_visit_date: last_visit_date_[local]
    next_expected_visit_date: next_expected_visit_date_[local]
  overrides:
    transformation_logic: |
      case when get(split(cohort_desc ,':'),0) like 'Cohort B%' then 'Cohort B'
          when get(split(cohort_desc ,':'),0) like 'Cohort F%' then 'Cohort F'
          when get(split(cohort_desc ,':'),0) like 'COHORT H%' then 'Cohort H'
          else get(split(cohort_desc ,':'),0) end as cohort,
      get(split(cohort_desc ,':'),1) as treatment_arm,
      concat('XB002_', upper(xb002_initial_dose_level)) as dose_level_treatment_arm_1,
      concat('XB002_', upper(xb002_initial_dose_level)) as dose_level_treatment_arm
    cross_entity_sql: null
- dataset_name: 4g_xb002_101_subject_visit_summary_report
  source_dataset_name: 4g_xb002_101_subject_visit_summary_report
  mapping_rules:
    studysite: study_site
    discontinued_rollback_request_approved: disc_rollback_approved
    screen_failure_rollback_request_approved: sf_rollback_approved
    scheduled_date: scheduled_date_[local]
    actual_date: actual_date_[local]
  overrides:
    transformation_logic: null
    cross_entity_sql: null
