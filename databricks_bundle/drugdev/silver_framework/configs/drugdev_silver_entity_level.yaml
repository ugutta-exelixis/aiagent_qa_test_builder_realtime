- dataset_name: cenduit_xl092_009_subject_summary_report
  source_dataset_name: cenduit_xl092_009_subject_summary_report
  mapping_rules: {}
  overrides:
    transformation_logic: "try_cast(case when site_number ='2124' then '1841'\n  else site_number \n  end as  string) as studysite,\n\
      cast(enrolled_cohort as string) as cohort_desc,\nTrim(split_part(enrolled_cohort,'-',1)) as cohort,\nsplit_part(enrolled_cohort,'-',2)\
      \ as treatment_arm,\ncase when Trim(split_part(enrolled_cohort,'-',1)) like '%Cohort A%' then 'Advanced Solid Tumors'\n\
      \  when Trim(split_part(enrolled_cohort,'-',1)) like '%Cohort B%' then '1L RCC'\n  when Trim(split_part(enrolled_cohort,'-',1))\
      \ like '%Cohort 1%' then '2L+RCC'\n  when Trim(split_part(enrolled_cohort,'-',1)) like '%Cohort 2%' then '1L RCC'\n\
      \  when Trim(split_part(enrolled_cohort,'-',1)) is null then 'Advanced Solid Tumors'\n  else null\n  end as tumor_type,\n\
      case when current_zanzalintinib_dose is null then null\n  else concat(current_zanzalintinib_dose,' ','zanzalintinib')\n\
      \  end as dose_level_treatment_arm_1,\ncase when current_ab521_dose is null then null\n  else concat(current_ab521_dose,'\
      \ ','ab521')\n  end as dose_level_treatment_arm_2,\ncase when current_zanzalintinib_dose is null and current_ab521_dose\
      \ is null then null\n  when current_zanzalintinib_dose is null then concat(trim(current_ab521_dose),' ','ab521')\n \
      \ when current_ab521_dose is null then concat(trim(current_zanzalintinib_dose),' ','zanzalintinib')\n  else CONCAT(concat(trim(current_zanzalintinib_dose),'\
      \ ','zanzalintinib'), '+', concat(trim(current_ab521_dose),' ','ab521'))\n  end as dose_level_treatment_arm\n"
    cross_entity_sql: null
