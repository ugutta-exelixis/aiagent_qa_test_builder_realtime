  overrides:
    transformation_logic: |
      try_cast(enrollment_cap   as int) as enrollment_cap,
      case when cohort_group = 'Single-Agent' then 'SOLID TUMORS'
          else cohort_group end as cohort_group
    cross_entity_sql: null
- dataset_name: 4g_xb010_101_subject_summary_report
  source_dataset_name: 4g_xb010_101_subject_summary_report
  mapping_rules:
    studysite: study_site
  overrides:
    transformation_logic: |
      case when cohort in('Not available','Screen Fail') then cohort else cohort end as cohort_desc,
      case
        when cohort is null then null
        when study_phase = 'Expansion' then concat_ws(' ', slice(split(cohort, ' '), 1, 2))
        else split(cohort, ':')[0]
      end as cohort,
      case when cohort in('Not available','Screen Fail') then cohort else get(split(cohort ,':'),1)  end as treatment_arm,
      case
              when trim(element_at(split(cohort, ':'), 2)) rlike '^[0-9]'
                then concat(split(`_study_id`, '-')[0], '_', trim(element_at(split(cohort, ':'), 2)))
              else trim(element_at(split(cohort, ':'), 2))
            end as dose_level_treatment_arm
    cross_entity_sql: null
