  overrides:
    transformation_logic: |
      regexp_extract(cohort_desc, '^(Cohort\\s+\\S+)', 1) AS cohort,
      regexp_replace(cohort_desc, '^Cohort\\s+\\S+[\\s-]*', '') AS treatment_arm,
      regexp_replace(cohort_desc, '^Cohort\\s+\\S+[\\s-]*', '') AS dose_level_treatment_arm
    cross_entity_sql: null
- dataset_name: 4g_xl092_002_cohort_summary_report
  source_dataset_name: 4g_xl092_002_cohort_summary_report
  mapping_rules: {}
  overrides:
    transformation_logic: |
      case when cohort_group = 'Single-Agent' then 'SOLID TUMORS'
          else cohort_group end as cohort_group, case when cohort in('12_A1','12_A2','13_A1', '13_A2') then '80'
      else enrollment_cap end as enrollment_cap
    cross_entity_sql: null
- dataset_name: 4g_xl092_002_subject_summary_report
  source_dataset_name: 4g_xl092_002_subject_summary_report
  mapping_rules:
    cohort_desc: cohort
    last_visit_date: last_visit_date_[local]
    next_expected_visit_date: next_expected_visit_date_[local]
  overrides:
    transformation_logic: "case when last_visit_date is null or last_visit_date = '' then concat(get(split(cohort_desc, ':'),\
      \ 0), ' ', get(split(cohort_desc, ' '), 1)) \n    when NOT regexp_like(lower(last_visit_date), '^[0-9]{1,2}-[a-z]{3}-[0-9]{2}$')\
      \ then concat(get(split(cohort_desc, ' '), 0), ' ', get(split(cohort_desc, ' '), 1))\n    when TO_DATE(last_visit_date,\
      \ 'dd-MMM-yy') < TO_DATE('08-Feb-24', 'dd-MMM-yy') and tumor_type = 'ccRCC 1L' and cohort_desc is null then 'Cohort\
      \ 1'\n    when TO_DATE(last_visit_date, 'dd-MMM-yy') >= TO_DATE('08-Feb-24', 'dd-MMM-yy') and tumor_type = 'ccRCC 1L'\
      \ and cohort_desc is null then 'Cohort 13'\n  else concat(get(split(cohort_desc, ':'), 0), ' ', get(split(cohort_desc,\
      \ ' '), 1)) end as cohort,\nregexp_replace(cohort_desc, '^Cohort\\\\s+\\\\d+\\\\s+', '') as treatment_arm,\nconcat('XL092_',\
      \ upper(xl092_initial_dose_level)) as dose_level_treatment_arm_1,\nconcat('XL092_', upper(xl092_initial_dose_level))\
      \ as dose_level_treatment_arm\n"
    cross_entity_sql: null
