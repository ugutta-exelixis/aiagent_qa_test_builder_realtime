- dataset_name: 4g_xb628_101_subject_summary_report
  source_dataset_name: 4g_xb628_101_subject_summary_report
  mapping_rules:
    studysite: study_site
    cohort_desc: cohort
    disc_rollback_approved: discontinue_rollback_approved
    dose_level_treatment_arm: starting_dose_level
    date_of_discontinuation: discontinuation_date
  overrides:
    transformation_logic: "get(split(cohort_desc ,':'),0)  as cohort,\nget(split(cohort_desc ,':'),1)  as treatment_arm,\n\
      case when stage = 'Escalation Stage' then 'Escalation' \n  else stage\n  end as study_phase, case \n    when stage is\
      \ not null then 'Advanced Solid Tumor' \n    else null \nend as tumor_type,\ncase\n  when lower(trim(cohort_desc)) rlike\
      \ '^esc\\\\s*combination\\\\b' then\n    regexp_replace(\n      trim(regexp_extract(cohort_desc, '(?i)^\\\\s*esc\\\\\
      s*combination\\\\s*(.+)$', 1)),\n      '\\\\s*\\\\+\\\\s*',\n      '+'\n    )\n  when lower(trim(cohort_desc)) rlike\
      \ '^cohort\\\\s*\\\\w+\\\\s*[:;\\\\-]' then\n    trim(regexp_extract(cohort_desc, '(?i)^\\\\s*cohort\\\\s*\\\\w+\\\\\
      s*[:;\\\\-]\\\\s*(.+)$', 1))\n  else null\nend as dose_level_treatment_arm\n"
    cross_entity_sql: null
