drugdev_clinical:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DAPLEX_KOIOS_HOST') }}"
      user: "{{ env_var('DAPLEX_KOIOS_USER') }}"
      password: "{{ env_var('DAPLEX_KOIOS_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('DAPLEX_KOIOS_DB') }}"
      schema: "{{ env_var('DAPLEX_KOIOS_SCHEMA') }}"
      threads: 4
      keepalives_idle: 0 # default 0, indicating the system default. See below
      connect_timeout: 10 # default 10 seconds
      retries: 1  # default 1 retry on error/timeout when opening connections
