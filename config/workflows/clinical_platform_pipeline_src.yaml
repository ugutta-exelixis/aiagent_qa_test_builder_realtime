# clinical_platform_pipeline_src.yaml
# Source-notebook pipeline for DEV SRC.
# Canonical deployed definition is in dab/databricks.yml under resources.jobs.clinical_platform_pipeline_src.

resources:
  jobs:
    clinical_platform_pipeline_src:
      name: "DDDA Clinical Platform Pipeline SRC [dev]"
      description: >
        Source-notebook variant of the clinical pipeline. Executes Bronze ingestion,
        Silver transformation, Gold model build, then emits pipeline summary.
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_src
          notebook_task:
            notebook_path: /Workspace/Shared/ddda-clinical-platform/dev/databricks_bundle/src/drugdev_data_extraction_workflow
        - task_key: silver_src
          depends_on:
            - task_key: bronze_src
          notebook_task:
            notebook_path: /Workspace/Shared/ddda-clinical-platform/dev/databricks_bundle/src/drugdev_silver_pipeline_workflow
        - task_key: gold_src
          depends_on:
            - task_key: silver_src
          notebook_task:
            notebook_path: /Workspace/Shared/ddda-clinical-platform/dev/databricks_bundle/src/drugdev_gold_pipeline_workflow
        - task_key: pipeline_summary_src
          depends_on:
            - task_key: gold_src
          notebook_task:
            notebook_path: /Workspace/Shared/ddda-clinical-platform/dev/databricks_bundle/src/drugdev_pipeline_summary_standalone
